<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C++ 面试口袋卡片 · 首页图 #023 · 9:16</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root {
    --blue: #3d5afe;
    --blue-deep: #3949ab;
    --ink: #1f232c;
    --ink-soft: #4a4f5a;
    --gray: #9aa0ac;
    --gray-light: #c4c9d4;
    --panel-bg: #ffffff;
    --page-bg: #e9ebf0;
    --line: #e8eaef;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
      "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 88px 16px 32px;
  }

  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 12px 16px;
    background: rgba(24, 28, 44, 0.92);
    backdrop-filter: blur(6px);
    color: #fff;
  }
  .btn {
    border: none; cursor: pointer;
    background: linear-gradient(135deg, #4c6ef5, #3b5bdb);
    color: #fff; font-size: 14px; font-weight: 600; letter-spacing: 1px;
    padding: 10px 20px; border-radius: 10px;
    box-shadow: 0 6px 16px rgba(61, 90, 254, 0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(61, 90, 254, 0.5); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .hint { font-size: 12px; color: #b9c0d6; letter-spacing: 0.5px; }

  .viewport { overflow: hidden; }
  .stage { transform-origin: top left; }
  .frame {
    width: 720px;
    height: 1280px;
    background: var(--page-bg);
    padding: 20px;
  }
  .panel {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--panel-bg);
    border: 1px solid #e2e5ec;
    border-radius: 22px;
    padding: 46px 52px 40px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .watermark {
    position: absolute;
    left: 50%;
    top: 66%;
    transform: translate(-50%, -50%);
    font-size: 600px;
    line-height: 1;
    font-weight: 800;
    color: #eaf0ff;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }
  .panel > *:not(.watermark) { position: relative; z-index: 1; }

  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { width: 56px; height: 56px; flex-shrink: 0; }
  .logo svg { width: 100%; height: 100%; display: block; }
  .brand-title { flex: 1; }
  .brand-title .en {
    font-size: 20px; font-weight: 700; letter-spacing: 1.5px; color: var(--ink);
  }
  .brand-title .cn {
    margin-top: 4px; font-size: 13px; color: var(--gray); letter-spacing: 3px;
  }
  .brand-no { text-align: right; }
  .brand-no .num {
    font-size: 28px; font-weight: 800; color: var(--blue-deep); letter-spacing: 1px;
  }
  .brand-no .tag {
    margin-top: 4px; font-size: 12px; color: var(--gray); letter-spacing: 2px;
  }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 92px;
  }
  .q-badge {
    width: 68px; height: 68px;
    border-radius: 16px;
    background: linear-gradient(150deg, #4c6ef5, #3b5bdb);
    box-shadow: 0 10px 22px rgba(59, 91, 219, 0.35);
    color: #fff;
    font-size: 34px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 34px;
  }
  .question {
    font-size: 58px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: 1px;
    color: var(--ink);
    margin-bottom: 30px;
  }
  .dash {
    width: 62%;
    border-top: 2px dashed #c3c9d8;
    margin-bottom: 22px;
  }
  .subtitle {
    font-size: 18px;
    letter-spacing: 4px;
    color: #9aa4c4;
    font-weight: 500;
  }

  .meta {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .meta .label {
    font-size: 12px; letter-spacing: 3px; color: var(--gray); margin-bottom: 14px;
  }
  .stars { color: var(--blue); font-size: 22px; letter-spacing: 8px; }
  .category { text-align: right; }
  .pill {
    display: inline-block;
    border: 1.5px solid var(--blue);
    color: var(--blue);
    font-size: 13px; font-weight: 700; letter-spacing: 3px;
    padding: 11px 30px;
    border-radius: 26px;
  }

  .foot-divider { height: 1px; background: var(--line); margin: 30px 0 18px; }
  .footer { display: flex; align-items: center; justify-content: space-between; }
  .footer .slogan { font-size: 12px; color: var(--gray); letter-spacing: 3px; }
  .dots { display: flex; align-items: center; gap: 9px; }
  .dots i {
    width: 9px; height: 9px; border-radius: 50%; background: #d3d7e0; display: block;
  }
  .dots i.active { background: var(--blue); }
</style>
</head>
<body>
  <div class="toolbar" data-html2canvas-ignore="true">
    <button id="exportBtn" class="btn">⬇ 导出 9:16 首页图 (PNG)</button>
    <span class="hint">画布 720 × 1280 · 导出为 2× 高清 (1440 × 2560)</span>
  </div>

  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <div class="panel">

          <div class="watermark" aria-hidden="true">?</div>

          <div class="brand">
            <div class="logo" aria-label="C++">
              <svg class="cpp-logo" width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img">
                <defs>
                  <linearGradient id="cppBadge" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#4c6ef5" />
                    <stop offset="1" stop-color="#3b5bdb" />
                  </linearGradient>
                </defs>
                <path d="M26 6 H74 A20 20 0 0 1 94 26 V74 A20 20 0 0 1 74 94 H26 L6 74 V26 A20 20 0 0 1 26 6 Z" fill="url(#cppBadge)" />
                <path d="M6 74 L26 94 H16 A10 10 0 0 1 6 84 Z" fill="#6f8dfb" />
                <path d="M48.6 36.2 A18 18 0 1 0 48.6 63.8" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
                <g fill="#ffffff">
                  <rect x="58" y="48" width="12" height="4" rx="1.6" />
                  <rect x="62" y="44" width="4" height="12" rx="1.6" />
                  <rect x="72" y="48" width="12" height="4" rx="1.6" />
                  <rect x="76" y="44" width="4" height="12" rx="1.6" />
                </g>
              </svg>
            </div>
            <div class="brand-title">
              <div class="en">C++ INTERVIEW CARD</div>
              <div class="cn">面试口袋卡片</div>
            </div>
            <div class="brand-no">
              <div class="num">#023</div>
              <div class="tag">现代特性 MODERN</div>
            </div>
          </div>

          <div class="hero">
            <div class="q-badge">Q.</div>
            <div class="question">异常安全的<br />三种保证？</div>
            <div class="dash"></div>
            <div class="subtitle">EXCEPTION&nbsp;SAFETY</div>
          </div>

          <div class="meta">
            <div class="difficulty">
              <div class="label">DIFFICULTY</div>
              <div class="stars">★ ★ ★</div>
            </div>
            <div class="category">
              <div class="label">CATEGORY</div>
              <span class="pill">MODERN</span>
            </div>
          </div>

          <div class="foot-divider"></div>
          <div class="footer">
            <div class="slogan">MAKE EACH ANSWER COUNT.</div>
            <div class="dots">
              <i></i><i></i><i class="active"></i>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var frame = document.getElementById('frame');
      var stage = document.getElementById('stage');
      var viewport = document.getElementById('viewport');
      var btn = document.getElementById('exportBtn');
      var W = 720, H = 1280;

      function fit() {
        var availW = window.innerWidth - 32;
        var availH = window.innerHeight - 88 - 32;
        var scale = Math.min(1, availW / W, availH / H);
        stage.style.transform = 'scale(' + scale + ')';
        viewport.style.width = (W * scale) + 'px';
        viewport.style.height = (H * scale) + 'px';
      }
      window.addEventListener('resize', fit);
      fit();

      function nextFrame() {
        return new Promise(function (resolve) {
          requestAnimationFrame(function () { requestAnimationFrame(resolve); });
        });
      }

      btn.addEventListener('click', async function () {
        if (typeof html2canvas !== 'function') {
          alert('html2canvas 尚未加载（可能网络受限）。请联网后重试，或直接对下方卡片使用系统截图。');
          return;
        }
        var label = btn.textContent;
        btn.disabled = true;
        btn.textContent = '正在导出…';

        stage.style.transform = 'none';
        viewport.style.width = W + 'px';
        viewport.style.height = H + 'px';
        await nextFrame();

        try {
          var canvas = await html2canvas(frame, {
            scale: 2,
            backgroundColor: '#e9ebf0',
            useCORS: true,
            logging: false,
            width: W,
            height: H,
            windowWidth: W,
            windowHeight: H
          });
          var link = document.createElement('a');
          link.download = '023-cpp-interview-cover.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (err) {
          alert('导出失败：' + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = label;
          fit();
        }
      });
    })();
  </script>
</body>
</html>
