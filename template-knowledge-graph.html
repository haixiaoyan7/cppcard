<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C++ 模板与泛型编程 · 知识图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0c1222;
    --ink-soft: #1a2438;
    --paper: #f3f6fb;
    --panel: rgba(255, 255, 255, 0.92);
    --panel-solid: #ffffff;
    --line: #d5deec;
    --muted: #6b7a94;
    --text: #1e2a3f;
    --cyan: #0d9488;
    --cyan-deep: #0f766e;
    --cyan-soft: #ccfbf1;
    --amber: #d97706;
    --amber-soft: #fef3c7;
    --blue: #2563eb;
    --blue-soft: #dbeafe;
    --rose: #e11d48;
    --rose-soft: #ffe4e6;
    --violet: #7c3aed;
    --violet-soft: #ede9fe;
    --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    color: var(--text);
    font-family: "Noto Sans SC", "DM Sans", sans-serif;
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }

  body {
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 50% at 10% -10%, rgba(13, 148, 136, 0.14), transparent 50%),
      radial-gradient(ellipse 60% 40% at 90% 0%, rgba(37, 99, 235, 0.10), transparent 45%),
      radial-gradient(ellipse 50% 40% at 70% 100%, rgba(217, 119, 6, 0.08), transparent 50%),
      linear-gradient(165deg, #eef2f8 0%, #f5f7fb 40%, #e8eef6 100%);
  }

  .app {
    --detail-w: 360px;
    display: grid;
    grid-template-columns: 280px 1fr 6px var(--detail-w);
    grid-template-rows: auto 1fr;
    height: 100vh;
    gap: 0;
  }

  /* ── Top bar ── */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 16px 28px;
    border-bottom: 1px solid rgba(213, 222, 236, 0.8);
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background:
      linear-gradient(145deg, #0d9488 0%, #0f766e 55%, #115e59 100%);
    box-shadow: 0 8px 20px rgba(13, 148, 136, 0.35);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .brand-mark svg { width: 22px; height: 22px; }

  .brand-text h1 {
    font-family: "DM Sans", "Noto Sans SC", sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1.2;
  }

  .brand-text p {
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .search {
    position: relative;
    width: min(280px, 36vw);
  }

  .search input {
    width: 100%;
    height: 40px;
    padding: 0 14px 0 40px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
    font: 500 13px/1 "Noto Sans SC", sans-serif;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .search input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
  }

  .search svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--muted);
    pointer-events: none;
  }

  .tool-btn {
    height: 40px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
    font: 600 12px/1 "Noto Sans SC", sans-serif;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
  }

  .tool-btn:hover {
    background: #f8fafc;
    border-color: #b8c5d8;
  }

  .tool-btn:active { transform: scale(0.97); }

  .tool-btn.primary {
    background: linear-gradient(135deg, #0d9488, #0f766e);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 6px 16px rgba(13, 148, 136, 0.28);
  }

  .tool-btn.primary:hover { filter: brightness(1.05); }

  /* ── Sidebar ── */
  .sidebar {
    padding: 22px 18px 28px;
    border-right: 1px solid rgba(213, 222, 236, 0.8);
    background: rgba(255, 255, 255, 0.55);
    overflow-y: auto;
    z-index: 10;
  }

  .side-block + .side-block { margin-top: 28px; }

  .side-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .layer-list, .legend-list, .path-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .layer-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 11px 12px;
    border: 1px solid transparent;
    border-radius: 14px;
    background: transparent;
    color: var(--text);
    font: 500 13px/1.3 "Noto Sans SC", sans-serif;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }

  .layer-btn:hover { background: rgba(255, 255, 255, 0.8); }

  .layer-btn.active {
    background: #fff;
    border-color: var(--line);
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
  }

  .layer-btn .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 3px var(--swatch-ring);
  }

  .layer-btn .meta {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    font-family: "DM Sans", sans-serif;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .legend-item i {
    width: 28px;
    height: 3px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .path-chip {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    text-align: left;
    width: 100%;
    font: inherit;
    color: inherit;
  }

  .path-chip:hover {
    border-color: var(--cyan);
    box-shadow: 0 6px 18px rgba(13, 148, 136, 0.1);
  }

  .path-chip .num {
    width: 22px;
    height: 22px;
    border-radius: 8px;
    background: var(--cyan-soft);
    color: var(--cyan-deep);
    font: 700 11px/22px "DM Sans", sans-serif;
    text-align: center;
    flex-shrink: 0;
  }

  .path-chip strong {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 3px;
  }

  .path-chip span {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.45;
  }

  /* ── Graph stage ── */
  .stage-wrap {
    position: relative;
    overflow: hidden;
    min-width: 0;
  }

  .stage {
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
  }

  .stage.dragging { cursor: grabbing; }

  .stage svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .edge {
    fill: none;
    stroke: #c5d0e0;
    stroke-width: 1.5;
    opacity: 0.7;
    transition: opacity 0.25s ease, stroke 0.25s ease, stroke-width 0.25s ease;
  }

  /* 焦点模式：无关边变细、变浅灰，不消失 */
  .stage.focus-on .edge.quiet {
    stroke: #dde4ef;
    stroke-width: 1;
    opacity: 0.45;
  }

  .edge.hot {
    opacity: 1;
    stroke-width: 2.4;
    stroke-linecap: round;
  }

  .edge.hot.flow {
    stroke-dasharray: 6 10;
    animation: edge-flow 1.1s linear infinite;
  }

  @keyframes edge-flow {
    to { stroke-dashoffset: -16; }
  }

  .edge-label-g {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .edge-label-g.show { opacity: 1; }

  .edge-label-g text {
    font-size: 10px;
    fill: #64748b;
    font-family: "DM Sans", "Noto Sans SC", sans-serif;
    font-weight: 600;
  }

  .node {
    cursor: grab;
  }

  .node.dragging {
    cursor: grabbing;
  }

  .node.dragging .body {
    filter: drop-shadow(0 8px 18px rgba(13, 148, 136, 0.28));
  }

  .node .glow {
    fill: #0d9488;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .node .ring {
    fill: none;
    stroke: #0d9488;
    stroke-width: 1.75;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .node .body {
    transition: fill 0.22s ease, stroke 0.22s ease, stroke-width 0.22s ease, filter 0.22s ease;
  }

  .node-title {
    font-family: "Noto Sans SC", "DM Sans", sans-serif;
    font-weight: 600;
    font-size: 12px;
    fill: var(--ink);
    pointer-events: none;
    transition: fill 0.22s ease;
  }

  .node-en {
    font-family: "DM Sans", sans-serif;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    fill: var(--muted);
    pointer-events: none;
    text-transform: uppercase;
    transition: fill 0.22s ease;
  }

  .node.hub .node-title { font-size: 14px; fill: #fff; }
  .node.hub .node-en { fill: rgba(255, 255, 255, 0.78); font-size: 9px; }

  /* 关联：细虚线青环，描边改青色 */
  .node.related .ring {
    opacity: 0.7;
    stroke-dasharray: 3.5 3.5;
  }
  .node.related:not(.hub) .body {
    stroke: #0d9488 !important;
    stroke-width: 2.2;
  }

  /* 选中：统一青色描边 + 轻投影 */
  .node.selected .glow { opacity: 0.08; }
  .node.selected .ring {
    opacity: 1;
    stroke-width: 1.8;
    stroke-dasharray: none;
  }
  .node.selected:not(.hub) .body {
    fill: #f0fdfa;
    stroke: #0d9488 !important;
    stroke-width: 2.6;
    filter: drop-shadow(0 4px 12px rgba(13, 148, 136, 0.18));
  }
  .node.selected.hub .body {
    filter: drop-shadow(0 6px 16px rgba(13, 148, 136, 0.32));
  }

  /* 无关：压低描边与英文，中文仍可读 */
  .stage.focus-on .node.quiet:not(.hub) .body {
    fill: #f8fafc;
    stroke: #dbe2ec;
    stroke-width: 1.4;
    filter: none;
  }
  .stage.focus-on .node.quiet .node-title { fill: #a0aec0; }
  .stage.focus-on .node.quiet .node-en { fill: #d0d7e2; }
  .stage.focus-on .node.quiet.hub .body { opacity: 0.5; }
  .stage.focus-on .node.quiet .glow,
  .stage.focus-on .node.quiet .ring { opacity: 0 !important; }

  .stage.path-on .node.on-path:not(.quiet):not(.selected):not(.hub) .body {
    stroke-width: 2.4;
  }
  .edge.on-path:not(.hot) {
    opacity: 0.8;
    stroke-width: 1.9;
  }

  .hint-bar {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(12, 18, 34, 0.88);
    color: rgba(255, 255, 255, 0.82);
    font-size: 12px;
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 32px rgba(12, 18, 34, 0.25);
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .hint-bar kbd {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.12);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: #fff;
  }

  /* ── Detail panel ── */
  .detail-resizer {
    position: relative;
    z-index: 15;
    cursor: col-resize;
    background: transparent;
    touch-action: none;
    user-select: none;
  }

  .detail-resizer::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    transform: translateX(-50%);
    background: rgba(213, 222, 236, 0.95);
    transition: background 0.15s, width 0.15s, box-shadow 0.15s;
  }

  .detail-resizer::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 36px;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background: #c5d0e0;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s;
  }

  .detail-resizer:hover::before,
  .detail-resizer.is-dragging::before {
    width: 2px;
    background: var(--cyan);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
  }

  .detail-resizer:hover::after,
  .detail-resizer.is-dragging::after {
    opacity: 1;
    background: var(--cyan);
  }

  body.is-resizing-detail {
    cursor: col-resize;
    user-select: none;
  }

  body.is-resizing-detail * {
    cursor: col-resize !important;
  }

  .detail {
    border-left: none;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(12px);
    overflow-y: auto;
    padding: 0;
    z-index: 10;
    min-width: 0;
  }

  .detail-empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 28px;
    text-align: center;
    color: var(--muted);
  }

  .detail-empty .orb {
    width: 72px;
    height: 72px;
    border-radius: 24px;
    margin-bottom: 18px;
    background:
      linear-gradient(145deg, var(--cyan-soft), var(--blue-soft));
    display: grid;
    place-items: center;
  }

  .detail-empty h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .detail-empty p {
    font-size: 13px;
    line-height: 1.6;
    max-width: 240px;
  }

  .detail-body { display: none; padding: 24px 22px 36px; }
  .detail.has-selection .detail-empty { display: none; }
  .detail.has-selection .detail-body { display: block; }

  .detail-head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 18px;
  }

  .detail-badge {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font: 700 14px/1 "DM Sans", sans-serif;
    color: #fff;
    flex-shrink: 0;
  }

  .detail-head h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1.25;
  }

  .detail-head .en {
    margin-top: 4px;
    font-family: "DM Sans", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
  }

  .pill {
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: #f1f5f9;
    color: var(--muted);
  }

  .pill.layer { background: var(--cyan-soft); color: var(--cyan-deep); }
  .pill.card { background: var(--blue-soft); color: var(--blue); }

  .section-title {
    margin: 22px 0 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .detail-body p.desc {
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
  }

  .points {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .points li {
    position: relative;
    padding: 12px 14px 12px 36px;
    border-radius: 12px;
    background: #f8fafc;
    border: 1px solid #eef2f7;
    font-size: 13px;
    line-height: 1.55;
  }

  .points li::before {
    content: attr(data-n);
    position: absolute;
    left: 12px;
    top: 12px;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    background: var(--cyan-soft);
    color: var(--cyan-deep);
    font: 700 10px/18px "DM Sans", sans-serif;
    text-align: center;
  }

  .rule-table-wrap {
    margin-top: 4px;
    overflow-x: auto;
    border-radius: 12px;
    border: 1px solid #e8eef6;
    background: #fff;
  }

  .rule-table {
    width: 100%;
    min-width: 520px;
    border-collapse: collapse;
    font-size: 11.5px;
    line-height: 1.45;
  }

  .rule-table th,
  .rule-table td {
    padding: 9px 10px;
    border-bottom: 1px solid #eef2f7;
    text-align: left;
    vertical-align: top;
  }

  .rule-table th {
    background: #f8fafc;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .rule-table tr:last-child td { border-bottom: none; }

  .rule-table .form {
    font-family: "SF Mono", Menlo, "JetBrains Mono", monospace;
    font-weight: 700;
    color: var(--cyan-deep);
    white-space: nowrap;
  }

  .rule-table .mono {
    font-family: "SF Mono", Menlo, "JetBrains Mono", monospace;
    font-size: 11px;
    color: #334155;
  }

  .rule-table .err {
    color: #e11d48;
    font-weight: 700;
  }

  .rule-table .note {
    color: var(--muted);
    font-size: 11px;
  }

  .code-window {
    margin-top: 4px;
    border-radius: 12px;
    overflow: hidden;
    background: #1f1f24;
    border: 1px solid #2c2c34;
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18);
  }

  .code-chrome {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 14px 8px;
    background: linear-gradient(180deg, #2a2a30 0%, #232328 100%);
    border-bottom: 1px solid #18181c;
  }

  .code-chrome .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    box-shadow: inset 0 -1px 1px rgba(0, 0, 0, 0.25);
  }

  .code-chrome .dot.red { background: #ff5f57; }
  .code-chrome .dot.yellow { background: #febc2e; }
  .code-chrome .dot.green { background: #28c840; }

  .code-chrome .code-file {
    margin-left: 8px;
    font-family: "SF Mono", Menlo, Monaco, "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    font-weight: 500;
    color: #9a9aa2;
    letter-spacing: 0.02em;
  }

  .code {
    margin: 0;
    padding: 14px 16px 16px;
    background: #1f1f24;
    color: #dfdfe0;
    font-family: "SF Mono", Menlo, Monaco, "Cascadia Code", "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre;
    tab-size: 2;
  }

  /* Xcode Dark Default 语法色 */
  .code .kw { color: #ff7ab2; }   /* keyword */
  .code .tp { color: #6bdfff; }   /* type / system type */
  .code .fn { color: #a8e6a1; }   /* function / declaration */
  .code .cm { color: #6c7986; }   /* comment */
  .code .str { color: #ff8170; }  /* string */
  .code .num { color: #d0a8ff; }  /* number / constant */

  .rel-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .rel-chip {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .rel-chip:hover {

  function layerColor(id) {
    return LAYERS.find(l => l.id === id)?.color || "#64748b";
  }

  function shortenEdge(x1, y1, x2, y2, r1, r2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    return {
      x1: x1 + ux * (r1 + 2),
      y1: y1 + uy * (r1 + 2),
      x2: x2 - ux * (r2 + 6),
      y2: y2 - uy * (r2 + 6),
    };
  }

  function layoutEdge(e) {
    const a = byId[e.from], b = byId[e.to];
    const s = shortenEdge(a.x, a.y, b.x, b.y, a.r, b.r);
    const midX = (s.x1 + s.x2) / 2;
    const midY = (s.y1 + s.y2) / 2 - 18;
    e.el.setAttribute("d", `M ${s.x1} ${s.y1} Q ${midX} ${midY} ${s.x2} ${s.y2}`);
    if (e.labelText) {
      e.labelText.setAttribute("x", midX);
      e.labelText.setAttribute("y", midY - 2);
    }
  }

  function layoutEdgesForNode(id) {
    for (const e of edgeEls) {
      if (e.from === id || e.to === id) layoutEdge(e);
    }
  }

  function setNodePos(n, el, x, y) {
    n.x = x;
    n.y = y;
    el.setAttribute("transform", `translate(${x},${y})`);
    layoutEdgesForNode(n.id);
  }

  function clientToWorld(clientX, clientY) {
    const rect = stage.getBoundingClientRect();
    return {
      x: (clientX - rect.left - cam.x) / cam.k,
      y: (clientY - rect.top - cam.y) / cam.k,

  }

  // build edges
  const edgeEls = EDGES.map(e => {
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("class", "edge");
    path.dataset.from = e.from;
    path.dataset.to = e.to;

    labelG.setAttribute("class", "edge-label-g");

    labelText.textContent = e.label;
    labelG.appendChild(labelText);
    gEdgeLabels.appendChild(labelG);

    const item = { ...e, el: path, labelEl: labelG, labelText, color: c };
    layoutEdge(item);
    return item;
  });

  function estimateTextWidth(str, fontSize) {
    let w = 0;
    for (const ch of str) {
      w += /[\u3400-\u9fff]/.test(ch) ? fontSize : fontSize * 0.62;
    }
    return w;
  }

  function wrapTitle(title) {
    if (title.length <= 4) return [title];
    const mid = Math.ceil(title.length / 2);
    return [title.slice(0, mid), title.slice(mid)];
  }

  function buildNodeLabel(n) {
    const margin = 8;
    const maxW = (n.r - margin) * 1.7;
    let lines = n.lines ? [...n.lines] : [n.title];
    let fontSize = n.hub ? 14 : 12;

    for (let guard = 0; guard < 10; guard++) {
      const widest = Math.max(...lines.map(l => estimateTextWidth(l, fontSize)));
      if (widest <= maxW) break;
      if (lines.length === 1 && n.title.length >= 4) {
        lines = wrapTitle(n.title);
        continue;
      }
      fontSize = Math.max(9, fontSize - 0.5);
    }

    const tag = (n.tag || n.en || "").toUpperCase();
    let tagSize = n.hub ? 9 : 8;
    while (estimateTextWidth(tag, tagSize) > maxW && tagSize > 6.5) tagSize -= 0.5;

    const lineH = fontSize + 1.5;
    const hasTag = !!tag;
    const titleBlockH = (lines.length - 1) * lineH;
    const blockH = titleBlockH + (hasTag ? tagSize + 5 : 0);
    const titleTop = -blockH / 2 + fontSize * 0.35;

    const titleEl = document.createElementNS(svgNS, "text");
    titleEl.setAttribute("class", "node-title");
    titleEl.setAttribute("text-anchor", "middle");
    titleEl.setAttribute("font-size", String(fontSize));
    if (n.hub) titleEl.style.fill = "#fff";

    lines.forEach((line, i) => {
      const ts = document.createElementNS(svgNS, "tspan");
      ts.setAttribute("x", "0");
      ts.setAttribute("y", String(titleTop + i * lineH));
      ts.textContent = line;
      titleEl.appendChild(ts);
    });

    const enEl = document.createElementNS(svgNS, "text");
    enEl.setAttribute("class", "node-en");
    enEl.setAttribute("text-anchor", "middle");
    enEl.setAttribute("font-size", String(tagSize));
    enEl.setAttribute("y", String(titleTop + titleBlockH + tagSize + 4));
    enEl.textContent = tag;
    if (n.hub) enEl.style.fill = "rgba(255,255,255,0.78)";

    return { titleEl, enEl };
  }

  function tightenLabels(list) {
    for (const { n, el } of list) {
      const r = n.r;
      const margin = 7;
      const texts = [...el.querySelectorAll("text")];
      for (let k = 0; k < 8; k++) {
        let overflow = false;
        for (const t of texts) {
          const b = t.getBBox();
          const corners = [
            [b.x, b.y], [b.x + b.width, b.y],
            [b.x, b.y + b.height], [b.x + b.width, b.y + b.height],
          ];
          if (corners.some(([x, y]) => Math.hypot(x, y) > r - margin)) {
            overflow = true;
            const fs = parseFloat(t.getAttribute("font-size") || "12") - 0.5;
            if (fs < 7) continue;
            t.setAttribute("font-size", String(fs));
          }
        }
        if (!overflow) break;
      }
    }
  }

  // build nodes
  const nodeEls = NODES.map(n => {
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("class", "node" + (n.hub ? " hub" : ""));
    g.dataset.id = n.id;
    g.style.setProperty("--node-c", layerColor(n.layer));
    g.setAttribute("transform", `translate(${n.x},${n.y})`);

    const glow = document.createElementNS(svgNS, "circle");
    glow.setAttribute("class", "glow");
    glow.setAttribute("r", n.r + 14);

    const ring = document.createElementNS(svgNS, "circle");
    ring.setAttribute("class", "ring");
    ring.setAttribute("r", n.r + 7);

    const body = document.createElementNS(svgNS, "circle");
    body.setAttribute("class", "body");
    body.setAttribute("r", n.r);
    body.setAttribute("filter", "url(#soft)");
    if (n.hub) {
      body.setAttribute("fill", "url(#hubGrad)");
      body.setAttribute("stroke", "#99f6e4");
      body.setAttribute("stroke-width", "2");
    } else {
      body.setAttribute("fill", "#ffffff");
      body.setAttribute("stroke", layerColor(n.layer));
      body.setAttribute("stroke-width", "2.5");
    }

    const { titleEl, enEl } = buildNodeLabel(n);
    g.append(glow, ring, body, titleEl, enEl);
    gNodes.appendChild(g);

    g.addEventListener("mouseenter", () => {
      if (!nodeDrag) hoverNode(n.id, true);
    });
    g.addEventListener("mouseleave", () => {
      if (!nodeDrag) hoverNode(n.id, false);
    });
    g.addEventListener("pointerdown", (ev) => {
      if (ev.button != null && ev.button !== 0) return;
      ev.stopPropagation();
      ev.preventDefault();
      // 先置顶再 capture，避免拖拽中重排丢掉指针捕获
      gNodes.appendChild(g);
      const world = clientToWorld(ev.clientX, ev.clientY);
      nodeDrag = {
        id: n.id,
        el: g,
        n,
        moved: false,
        grabDX: n.x - world.x,
        grabDY: n.y - world.y,
        startX: ev.clientX,
        startY: ev.clientY,
        pointerId: ev.pointerId,
      };
      panning = false;
      g.classList.add("dragging");
      g.classList.remove("quiet");
      // 在 stage 上捕获，节点未选中时拖出 hit 区也不会断
      stage.setPointerCapture(ev.pointerId);
    });

    return { n, el: g };
  });

  // 字体就绪后再实测收缩，避免首次测量不准
  const runTighten = () => tightenLabels(nodeEls);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(runTighten);
  } else {
    requestAnimationFrame(runTighten);
  }

  function neighborsOf(id) {
    const set = new Set([id]);
    for (const e of EDGES) {
      if (e.from === id) set.add(e.to);
      if (e.to === id) set.add(e.from);
    }
    return set;
  }

  function visibleIds() {
    let ids = new Set(NODES.map(n => n.id));
    if (activeLayer !== "all") {
      ids = new Set(NODES.filter(n => n.layer === activeLayer || n.layer === "hub").map(n => n.id));
    }
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      ids = new Set([...ids].filter(id => {
        const n = byId[id];
        return n.title.toLowerCase().includes(q)
          || n.en.toLowerCase().includes(q)
          || n.summary.toLowerCase().includes(q);
      }));
    }
    return ids;
  }

  function applyVisualState(hoverId = null) {
    const vis = visibleIds();
    const focus = selectedId || hoverId;
    const hot = focus ? neighborsOf(focus) : null;
    const pathSet = pathHighlight ? new Set(pathHighlight) : null;
    const focusing = !!(focus || pathSet);

    stage.classList.toggle("focus-on", focusing);
    stage.classList.toggle("path-on", !!pathSet);

    for (const { n, el } of nodeEls) {
      const inVis = vis.has(n.id);
      const inPath = !pathSet || pathSet.has(n.id);
      const inHot = !hot || hot.has(n.id);
      const isQuiet = !inVis || !inPath || (hot && !inHot);
      const isRelated = !!(hot && hot.has(n.id) && n.id !== focus);
      const isSelected = n.id === selectedId || (!selectedId && n.id === hoverId);

      el.classList.toggle("quiet", isQuiet);
      el.classList.toggle("related", isRelated && !isQuiet);
      el.classList.toggle("selected", isSelected && inVis);
      el.classList.toggle("on-path", !!(pathSet && pathSet.has(n.id)));
      el.style.display = inVis ? "" : "none";
    }

    for (const e of edgeEls) {
      const bothVis = vis.has(e.from) && vis.has(e.to);
      const bothPath = !pathSet || (pathSet.has(e.from) && pathSet.has(e.to));
      const isHot = !!(hot && bothVis && bothPath
        && hot.has(e.from) && hot.has(e.to)
        && (e.from === focus || e.to === focus));
      const isQuiet = !bothVis || !bothPath || (hot && !isHot);
      const onPath = !!(pathSet && pathSet.has(e.from) && pathSet.has(e.to));

      e.el.classList.toggle("quiet", isQuiet);
      e.el.classList.toggle("hot", isHot);
      e.el.classList.toggle("flow", isHot);
      e.el.classList.toggle("on-path", onPath && bothVis);
      e.el.style.display = bothVis ? "" : "none";
      // hot edges keep their semantic color; quiet edges already styled via CSS
      if (isHot) e.el.style.stroke = e.color;
      e.labelEl.classList.toggle("show", isHot);
      e.labelEl.style.display = bothVis ? "" : "none";
    }
  }

  function hoverNode(id, on) {
    if (selectedId) return;
    applyVisualState(on ? id : null);
  }

  function selectNode(id, { keepPath = false } = {}) {
    selectedId = id;
    if (!keepPath) pathHighlight = null;
    renderDetail(byId[id]);
    detail.classList.add("has-selection");
    applyVisualState();
    hintBar.style.opacity = "0";
  }

  function clearSelection() {
    selectedId = null;
    pathHighlight = null;
    detail.classList.remove("has-selection");
    applyVisualState();
    hintBar.style.opacity = "1";
    document.querySelectorAll(".path-chip").forEach(c => {
      c.style.borderColor = "";
    });
  }

  function cardLinks(card) {
    const num = card.num;
    let slug = card.slug;
    if (!slug && card.href) {
      slug = card.href.split("/")[0];
    }
    if (!slug) return null;
    return {
      card: `${slug}/${num}-cpp-interview-card.html`,
      followup: `${slug}/${num}-cpp-interview-followup.html`,
    };
  }

  function renderDetail(n) {
    const color = layerColor(n.layer);
    const layerName = LAYERS.find(l => l.id === n.layer)?.name || "";
    const rels = EDGES.filter(e => e.from === n.id || e.to === n.id).map(e => {
      const other = e.from === n.id ? e.to : e.from;
      const outbound = e.from === n.id;
      return { other: byId[other], label: e.label, outbound };
    });

    detailBody.innerHTML = `
      <div class="detail-head">
        <div class="detail-badge" style="background:${color}">${n.title.slice(0, 1)}</div>
        <div>
          <h2>${n.title}</h2>
          <div class="en">${n.en}</div>
        </div>
      </div>
      <div class="pill-row">
        <span class="pill layer">${layerName}</span>
        ${n.card ? `<span class="pill card">卡片 #${n.card.num}</span>` : ""}
        <span class="pill">${rels.length} 条关联</span>
      </div>
      <p class="desc">${n.summary}</p>
      <div class="section-title">面试要点</div>
      <ul class="points">
        ${n.points.map((p, i) => `<li data-n="${String(i + 1).padStart(2, "0")}">${p}</li>`).join("")}
      </ul>
      ${n.table ? `<div class="section-title">推导对照表</div>${n.table}` : ""}
      <div class="section-title">代码示意</div>
      <div class="code-window">
        <div class="code-chrome">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="code-file">${n.id.replace(/_/g, "-")}.cpp</span>
        </div>
        <div class="code">${n.code}</div>
      </div>
      <div class="section-title">关联节点</div>
      <div class="rel-list">
        ${rels.map(r => `
          <button class="rel-chip" data-goto="${r.other.id}" type="button">
            <span class="dir">${r.outbound ? "通向" : "来自"} · ${r.label}</span>
            ${r.other.title}
          </button>`).join("")}
      </div>
      ${(() => {
        const links = n.card && cardLinks(n.card);
        if (!links) return "";
        return `
        <div class="section-title">系列卡片 #${n.card.num}</div>
        <div class="card-links">
          <a class="link-card card-ans" href="${links.card}" target="_blank" rel="noopener">
            <span class="link-kicker">Answer</span>
            参考回答
            <small>card · 面试话术</small>
          </a>
          <a class="link-card card-fu" href="${links.followup}" target="_blank" rel="noopener">
            <span class="link-kicker">Follow-up</span>
            追问清单
            <small>followup · 深挖题</small>
          </a>
        </div>`;
      })()}
    `;

    detailBody.querySelectorAll("[data-goto]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.goto;
        const keepPath = !!(pathHighlight && pathHighlight.includes(id));
        selectNode(id, { keepPath });
      });
    });
  }

  // layers UI
  function renderLayers() {
    layerList.innerHTML = "";
    const allBtn = document.createElement("button");
    allBtn.className = "layer-btn" + (activeLayer === "all" ? " active" : "");
    allBtn.type = "button";
    allBtn.innerHTML = `<span class="swatch" style="background:#0f172a;--swatch-ring:rgba(15,23,42,.12)"></span>全部显示<span class="meta">${NODES.length}</span>`;
    allBtn.addEventListener("click", () => setLayer("all"));
    layerList.appendChild(allBtn);

    for (const L of LAYERS) {
      const btn = document.createElement("button");
      btn.className = "layer-btn" + (activeLayer === L.id ? " active" : "");
      btn.type = "button";
      btn.innerHTML = `<span class="swatch" style="background:${L.color};--swatch-ring:${L.ring}"></span>${L.name}<span class="meta">${L.count}</span>`;
      btn.addEventListener("click", () => setLayer(L.id));
      layerList.appendChild(btn);
    }
  }

  function setLayer(id) {
    activeLayer = id;
    pathHighlight = null;
    layerCount.textContent = id === "all" ? "全部" : LAYERS.find(l => l.id === id).name;
    renderLayers();
    applyVisualState();
  }

  // paths UI
  PATHS.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.className = "path-chip";
    btn.type = "button";
    btn.innerHTML = `<span class="num">${i + 1}</span><div><strong>${p.title}</strong><span>${p.desc}</span></div>`;
    btn.addEventListener("click", () => {
      pathHighlight = p.nodes;
      document.querySelectorAll(".path-chip").forEach(c => { c.style.borderColor = ""; });
      btn.style.borderColor = "#0d9488";
      selectNode(p.nodes[0], { keepPath: true });
    });
    pathList.appendChild(btn);
  });

  // camera
  function applyCam() {
    gWorld.setAttribute("transform", `translate(${cam.x},${cam.y}) scale(${cam.k})`);
  }

  function fitView() {
    const pad = 80;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of NODES) {
      minX = Math.min(minX, n.x - n.r);
      minY = Math.min(minY, n.y - n.r);
      maxX = Math.max(maxX, n.x + n.r);
      maxY = Math.max(maxY, n.y + n.r);
    }
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    const bw = maxX - minX + pad * 2;
    const bh = maxY - minY + pad * 2;
    const k = Math.min(w / bw, h / bh, 1.35);
    cam.k = k;
    cam.x = (w - bw * k) / 2 - (minX - pad) * k;
    cam.y = (h - bh * k) / 2 - (minY - pad) * k;
    applyCam();
  }

  function resetLayout() {
    for (const { n, el } of nodeEls) {
      setNodePos(n, el, n.homeX, n.homeY);
    }
    fitView();
  }

  function endNodeDrag() {
    if (!nodeDrag) return;
    const { el, n, pointerId } = nodeDrag;
    el.classList.remove("dragging");
    try { stage.releasePointerCapture(pointerId); } catch (_) {}
    nodeDrag = null;
    const keepPath = !!(pathHighlight && pathHighlight.includes(n.id));
    selectNode(n.id, { keepPath });
  }

  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".node") || nodeDrag) return;
    panning = true;
    stage.classList.add("dragging");
    last = { x: e.clientX, y: e.clientY };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", (e) => {
    if (nodeDrag) {
      e.preventDefault();
      const dx = e.clientX - nodeDrag.startX;
      const dy = e.clientY - nodeDrag.startY;
      if (!nodeDrag.moved && Math.hypot(dx, dy) > 4) nodeDrag.moved = true;
      if (!nodeDrag.moved) return;
      const world = clientToWorld(e.clientX, e.clientY);
      setNodePos(
        nodeDrag.n,
        nodeDrag.el,
        world.x + nodeDrag.grabDX,
        world.y + nodeDrag.grabDY
      );
      return;
    }
    if (!panning) return;
    cam.x += e.clientX - last.x;
    cam.y += e.clientY - last.y;
    last = { x: e.clientX, y: e.clientY };
    applyCam();
  });
  stage.addEventListener("pointerup", (e) => {
    if (nodeDrag) {
      endNodeDrag();
      return;
    }
    panning = false;
    stage.classList.remove("dragging");
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener("pointercancel", (e) => {
    if (nodeDrag) {
      endNodeDrag();
      return;
    }
    panning = false;
    stage.classList.remove("dragging");
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const prev = cam.k;
    const next = Math.min(2.2, Math.max(0.45, cam.k * (e.deltaY < 0 ? 1.08 : 0.92)));
    const wx = (mx - cam.x) / prev;
    const wy = (my - cam.y) / prev;
    cam.k = next;
    cam.x = mx - wx * next;
    cam.y = my - wy * next;
    applyCam();
  }, { passive: false });

  document.getElementById("btn-fit").addEventListener("click", fitView);
  document.getElementById("btn-reset").addEventListener("click", resetLayout);
  document.getElementById("btn-clear").addEventListener("click", clearSelection);
  document.getElementById("btn-tour").addEventListener("click", () => {
    pathList.querySelector(".path-chip")?.click();
  });
  document.getElementById("search").addEventListener("input", (e) => {
    searchQuery = e.target.value.trim();
    applyVisualState();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") clearSelection();
  });

  // 右侧栏拖拽改宽
  (function setupDetailResize() {
    const appEl = document.querySelector(".app");
    const handle = document.getElementById("detail-resizer");
    if (!appEl || !handle) return;

    const MIN_W = 280;
    const MAX_W = 720;
    const KEY = "kg-detail-w";

    const saved = Number(localStorage.getItem(KEY));
    if (Number.isFinite(saved) && saved >= MIN_W && saved <= MAX_W) {
      appEl.style.setProperty("--detail-w", `${saved}px`);
    }

    let resizing = false;

    const applyWidth = (clientX) => {
      const rect = appEl.getBoundingClientRect();
      let w = rect.right - clientX;
      w = Math.min(MAX_W, Math.max(MIN_W, w));
      appEl.style.setProperty("--detail-w", `${w}px`);
      return w;
    };

    handle.addEventListener("pointerdown", (e) => {
      if (window.matchMedia("(max-width: 1100px)").matches) return;
      e.preventDefault();
      resizing = true;
      handle.classList.add("is-dragging");
      document.body.classList.add("is-resizing-detail");
      handle.setPointerCapture(e.pointerId);
      applyWidth(e.clientX);
    });

    handle.addEventListener("pointermove", (e) => {
      if (!resizing) return;
      applyWidth(e.clientX);
    });

    const endResize = (e) => {
      if (!resizing) return;
      resizing = false;
      handle.classList.remove("is-dragging");
      document.body.classList.remove("is-resizing-detail");
      const w = applyWidth(e.clientX);
      localStorage.setItem(KEY, String(Math.round(w)));
      fitView();
    };

    handle.addEventListener("pointerup", endResize);
    handle.addEventListener("pointercancel", endResize);

    handle.addEventListener("dblclick", () => {
      appEl.style.setProperty("--detail-w", "360px");
      localStorage.setItem(KEY, "360");
      fitView();
    });
  })();

  window.addEventListener("resize", () => fitView());

  renderLayers();
  applyVisualState();
  requestAnimationFrame(() => {
    fitView();
    // gentle entrance: select hub after brief delay
    setTimeout(() => selectNode("generic"), 400);
  });
})();
</script>
</body>
</html>
