<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C++ 面试卡片 · 导航索引</title>
<style>
  :root {
    --blue: #3d5afe;
    --blue-deep: #3949ab;
    --blue-soft: #eef2ff;
    --ink: #1f232c;
    --ink-soft: #4a4f5a;
    --muted: #8b919e;
    --line: #e8eaef;
    --panel: #ffffff;
    --page: #e9ebf0;
    --hot: #e8590c;
    --hot-bg: #fff4e6;
    --super: #c92a2a;
    --super-bg: #ffe3e3;
    --ok: #2b8a3e;
    --shadow: 0 8px 30px rgba(31, 35, 44, 0.08);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
      "Helvetica Neue", Arial, sans-serif;
    background: var(--page);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(24, 28, 44, 0.94);
    backdrop-filter: blur(8px);
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .topbar-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .brand-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #4c6ef5, #3b5bdb);
    display: grid; place-items: center;
    font-weight: 800; font-size: 13px;
  }
  .brand-text h1 {
    font-size: 16px; font-weight: 700; letter-spacing: 0.5px;
  }
  .brand-text p {
    font-size: 11px; color: #b9c0d6; margin-top: 1px;
  }

  .search-wrap {
    flex: 1; min-width: 200px; max-width: 420px;
  }
  .search {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-radius: 10px;
    padding: 9px 14px 9px 36px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .search:focus {
    border-color: rgba(76,110,245,0.8);
    background: rgba(255,255,255,0.12);
  }
  .search-box { position: relative; }
  .search-box svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    opacity: 0.55;
  }
  .search::placeholder { color: #8891a8; }

  .top-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    border: none; cursor: pointer;
    background: linear-gradient(135deg, #4c6ef5, #3b5bdb);
    color: #fff; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 9px;
    transition: transform 0.12s, box-shadow 0.12s;
    white-space: nowrap;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(61,90,254,0.35); }
  .btn-ghost {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
  }
  .btn-ghost:hover { box-shadow: none; background: rgba(255,255,255,0.14); }

  .layout {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 20px 48px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 24px;
    align-items: start;
  }

  .sidebar { position: sticky; top: 88px; }
  .side-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .side-panel h2 {
    font-size: 12px; font-weight: 700; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 12px;
  }
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--blue-soft);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .stat .val { font-size: 22px; font-weight: 800; color: var(--blue-deep); }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .mod-nav { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
  .mod-link {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 8px;
    font-size: 13px; color: var(--ink-soft);
    text-decoration: none; transition: background 0.12s;
  }
  .mod-link:hover { background: var(--blue-soft); color: var(--blue-deep); }
  .mod-link .cnt {
    font-size: 11px; color: var(--muted);
    background: var(--page); padding: 1px 7px; border-radius: 999px;
  }

  .res-list { display: flex; flex-direction: column; gap: 6px; }
  .res-link {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: 8px;
    font-size: 13px; color: var(--ink);
    text-decoration: none; border: 1px solid var(--line);
    transition: border-color 0.12s, background 0.12s;
  }
  .res-link:hover { border-color: var(--blue); background: var(--blue-soft); }
  .res-tag {
    font-size: 10px; font-weight: 600; color: var(--blue-deep);
    background: var(--blue-soft); padding: 2px 7px; border-radius: 999px;
  }

  .main { min-width: 0; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 18px;
  }
  .filter {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-soft);
    font-size: 13px; font-weight: 500;
    padding: 7px 14px; border-radius: 999px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .filter:hover { border-color: var(--blue); color: var(--blue-deep); }
  .filter.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .filter .n {
    display: inline-block;
    margin-left: 4px;
    font-size: 11px; opacity: 0.75;
  }

  .result-bar {
    font-size: 13px; color: var(--muted);
    margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .result-bar strong { color: var(--ink); }

  .module-block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .module-block.hidden { display: none; }

  .module-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: linear-gradient(90deg, var(--blue-soft), transparent 70%);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
  }
  .module-head h3 {
    font-size: 15px; font-weight: 700; color: var(--ink);
  }
  .module-head .range {
    font-size: 12px; color: var(--muted); font-weight: 500;
    margin-left: 8px;
  }
  .module-head .toggle {
    font-size: 12px; color: var(--muted);
    transition: transform 0.2s;
  }
  .module-block.collapsed .module-head .toggle { transform: rotate(-90deg); }
  .module-block.collapsed .topic-list { display: none; }

  .topic-list { padding: 6px 0; }

  .topic-row {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 11px 18px;
    border-bottom: 1px solid var(--line);
    transition: background 0.1s;
  }
  .topic-row:last-child { border-bottom: none; }
  .topic-row:hover { background: #fafbfc; }
  .topic-row.hidden { display: none; }

  .topic-num {
    font-size: 13px; font-weight: 800; color: var(--blue);
    font-variant-numeric: tabular-nums;
  }

  .topic-main { min-width: 0; }
  .topic-title {
    font-size: 14px; font-weight: 600; color: var(--ink);
    line-height: 1.45;
  }
  .topic-meta {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;
  }
  .badge {
    font-size: 11px; font-weight: 600;
    padding: 1px 8px; border-radius: 999px;
  }
  .badge-hot { background: var(--hot-bg); color: var(--hot); }
  .badge-super { background: var(--super-bg); color: var(--super); }
  .badge-stars { background: var(--page); color: var(--muted); }
  .badge-track {
    background: var(--blue-soft); color: var(--blue-deep);
    font-weight: 500;
  }

  .topic-links {
    display: flex; gap: 6px; flex-shrink: 0;
  }
  .link-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 44px;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px; font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    background: var(--panel);
    transition: all 0.12s;
  }
  .link-btn:hover {
    border-color: var(--blue);
    color: var(--blue);
    background: var(--blue-soft);
  }
  .link-btn.primary {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .link-btn.primary:hover {
    background: var(--blue-deep);
    border-color: var(--blue-deep);
    color: #fff;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    display: none;
  }
  .empty-state.show { display: block; }

  .footer {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px 32px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .mod-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .topic-row {
      grid-template-columns: 48px 1fr;
      grid-template-rows: auto auto;
    }
    .topic-links {
      grid-column: 2;
      justify-content: flex-start;
    }
  }
</style>
</head>

function pad(n) { return String(n).padStart(3, '0'); }

function itemPath(item, type) {
  const n = pad(item.num);
  const base = `${item.folder}/${n}-cpp-interview-${type}.html`;
  return base;
}

function allItems() {
  return DATA.modules.flatMap(m => m.items.map(it => ({ ...it, moduleName: m.name, moduleStart: m.start })));
}

function starsText(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }

function matchesFilter(item, filter) {
  if (filter === 'all') return true;
  if (filter === 'hot') return item.hot;
  if (filter === 'super') return item.superHot;
  return item.tracks.includes(filter);
}

function matchesSearch(item, q) {
  if (!q) return true;
  const hay = `#${pad(item.num)} ${item.title} ${item.moduleName}`.toLowerCase();
  return hay.includes(q.toLowerCase());
}

let currentFilter = 'all';
let searchQuery = '';

function render() {
  const items = allItems();
  const hotCount = items.filter(i => i.hot).length;
  const superCount = items.filter(i => i.superHot).length;
  const backendCount = items.filter(i => i.tracks.includes('backend')).length;
  const clientCount = items.filter(i => i.tracks.includes('client')).length;
  const huaweiCount = items.filter(i => i.tracks.includes('huawei')).length;

  document.getElementById('statHot').textContent = hotCount;
  document.getElementById('cntHot').textContent = hotCount;
  document.getElementById('cntSuper').textContent = superCount;
  document.getElementById('cntBackend').textContent = backendCount;
  document.getElementById('cntClient').textContent = clientCount;
  document.getElementById('cntHuawei').textContent = huaweiCount;

  const container = document.getElementById('moduleContainer');
  container.innerHTML = '';

  let visibleTotal = 0;

  DATA.modules.forEach((mod, mi) => {
    const block = document.createElement('section');
    block.className = 'module-block';
    block.id = `mod-${mi + 1}`;

    const visibleItems = mod.items.filter(it =>
      matchesFilter(it, currentFilter) && matchesSearch(it, searchQuery)
    );

    if (visibleItems.length === 0) {
      block.classList.add('hidden');
    } else {
      visibleTotal += visibleItems.length;
    }

    block.innerHTML = `
      <div class="module-head" data-mod="${mi}">
        <h3>模块${mod.name}<span class="range">#${pad(mod.start)}–${pad(mod.end)}</span></h3>
        <span class="toggle">▼</span>
      </div>
      <div class="topic-list"></div>
    `;

    const list = block.querySelector('.topic-list');

    mod.items.forEach(item => {
      const show = matchesFilter(item, currentFilter) && matchesSearch(item, searchQuery);
      const row = document.createElement('div');
      row.className = 'topic-row' + (show ? '' : ' hidden');
      row.dataset.num = item.num;

      const badges = [];
      if (item.superHot) badges.push('<span class="badge badge-super">🔥🔥</span>');
      else if (item.hot) badges.push('<span class="badge badge-hot">🔥 高频</span>');
      badges.push(`<span class="badge badge-stars">${starsText(item.stars)}</span>`);

      row.innerHTML = `
        <div class="topic-num">#${pad(item.num)}</div>
        <div class="topic-main">
          <div class="topic-title">${item.title}</div>
          <div class="topic-meta">${badges.join('')}</div>
        </div>
        <div class="topic-links">
          <a class="link-btn primary" href="${itemPath(item, 'card')}" title="参考回答">回答</a>
          <a class="link-btn" href="${itemPath(item, 'followup')}" title="追问">追问</a>
        </div>
      `;
      list.appendChild(row);
    });

    block.querySelector('.module-head').addEventListener('click', () => {
      block.classList.toggle('collapsed');
    });

    container.appendChild(block);
  });

  document.getElementById('visibleCount').textContent = visibleTotal;
  document.getElementById('emptyState').classList.toggle('show', visibleTotal === 0);

  const hints = {
    all: '', hot: '仅显示面经高频考点', super: '仅显示 🔥🔥 超高频/手撕相关',
    backend: '并发 + 网络/OS + 数据库', client: '编译链接 + 语言细节 + STL',
    huawei: '模块一～二：指针内存 + 面向对象'
  };
  document.getElementById('filterHint').textContent = hints[currentFilter] || '';
}

function buildModNav() {
  const nav = document.getElementById('modNav');
  DATA.modules.forEach((mod, i) => {
    const a = document.createElement('a');
    a.className = 'mod-link';
    a.href = `#mod-${i + 1}`;
    a.innerHTML = `<span>模块${mod.name.split('：')[0]}</span><span class="cnt">${mod.items.length}</span>`;
    a.addEventListener('click', e => {
      e.preventDefault();
      const el = document.getElementById(`mod-${i + 1}`);
      el.classList.remove('collapsed', 'hidden');
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    nav.appendChild(a);
  });
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter');
  if (!btn) return;
  currentFilter = btn.dataset.filter;
  document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

document.getElementById('btnExpand').addEventListener('click', () => {
  const blocks = [...document.querySelectorAll('.module-block')];
  const anyCollapsed = blocks.some(b => b.classList.contains('collapsed'));
  blocks.forEach(b => b.classList.toggle('collapsed', !anyCollapsed));
  document.getElementById('btnExpand').textContent = anyCollapsed ? '收起全部' : '展开全部';
});

document.getElementById('btnRandom').addEventListener('click', () => {
  const pool = allItems().filter(it =>
    matchesFilter(it, currentFilter) && matchesSearch(it, searchQuery)
  );
  if (!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  window.location.href = itemPath(pick, 'card');
});

buildModNav();
render();
</script>
